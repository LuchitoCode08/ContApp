# Workflow: build + release

# Stack: Python only (no Node).
# La alerta de Node20 obsoleto en GitHub Actions no aplica a este repo.
#
# Se dispara cuando se pushea un tag con formato v*.*.*  (ej: v1.0.1).
# Hace:
#   1. Build con PyInstaller (dist/ContApp/)
#   2. Build con Inno Setup (dist/ContApp_Setup-X.Y.Z.exe)
#   3. Crea GitHub Release con el instalador como asset.
#
# Variables opcionales (no requeridas):
#   - ISCC_PATH: ruta absoluta a ISCC.exe si no esta en el PATH.
#     Default: C:\Program Files (x86)\Inno Setup 6\ISCC.exe

# Versions pinned (no tags moviles) para maxima reproducibilidad.
# Para actualizar: editar este header y commitear.
name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Permitir ejecutar manualmente desde Actions.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a buildear (ej: 1.0.0). Si vacio, usa el tag actual.'
        required: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Python 3.14
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Mostrar version
        id: version
        shell: pwsh
        run: |
          # Si hay tag, usar esa version. Si no (workflow_dispatch), usar el input.
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) {
            $version = $tag.Substring(1)
          } elseif ("${{ inputs.version }}" -ne "") {
            $version = "${{ inputs.version }}"
          } else {
            # Fallback: leer de app/version.py
            $version = Select-String -Path "app\version.py" -Pattern '__version__\s*=\s*"([^"]+)"' | ForEach-Object { $_.Matches.Groups[1].Value }
          }
          Write-Host "Version: $version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Verificar coincidencia con app/version.py
        shell: pwsh
        run: |
          $fileVersion = Select-String -Path "app\version.py" -Pattern '__version__\s*=\s*"([^"]+)"' | ForEach-Object { $_.Matches.Groups[1].Value }
          if ($fileVersion -ne "${{ steps.version.outputs.VERSION }}") {
            Write-Host "::error::La version del tag (${{ steps.version.outputs.VERSION }}) no coincide con app/version.py ($fileVersion)"
            exit 1
          }
          Write-Host "OK: version coincide con app/version.py ($fileVersion)"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Ejecutar tests
        run: python -m pytest tests/ -v

      - name: Limpiar builds previos
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - name: Build con PyInstaller
        run: pyinstaller --noconfirm --clean ContApp.spec

      - name: Instalar Inno Setup
        # Inno Setup no viene por defecto en el runner; lo descargamos.
        # Version 6.x (gratis, suficiente para nuestro script).
        shell: pwsh
        run: |
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $isccPath) {
            echo "::notice::ISCC ya instalado en $isccPath"
            exit 0
          }
          # Descargar e instalar Inno Setup 6.4.3 (chocolatey).
          # Esto puede tardar 1-2 min en la primera corrida.
          choco install innosetup -y --version=6.4.3 --no-progress --limit-output
          echo "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV

      - name: Build instalador con Inno Setup
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $iscc = if ($env:ISCC_PATH) { $env:ISCC_PATH } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DMyAppVersion=$version ContApp.iss

      - name: Comprimir bundle para distribucion opcional
        shell: pwsh
        run: |
          # Zip portable: descomprimir en cualquier lado -> ejecutar ContApp.exe.
          # Util para usuarios avanzados que no quieren instalar.
          $version = "${{ steps.version.outputs.VERSION }}"
          $zipPath = "dist\ContApp-$version-portable.zip"
          Compress-Archive -Path "dist\ContApp\*" -DestinationPath $zipPath -Force

      - name: Listar artefactos
        shell: pwsh
        run: Get-ChildItem dist

      - name: Subir artefactos (run manual)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ContApp-${{ steps.version.outputs.VERSION }}
          path: |
            dist/ContApp_Setup-*.exe
            dist/ContApp-*-portable.zip
          if-no-files-found: error

      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.4.1
        with:
          name: "ContApp ${{ steps.version.outputs.VERSION }}"
          body: |
            ## ContApp ${{ steps.version.outputs.VERSION }}

            Instalador de ContApp para Windows x64.

            ### Descarga

            - **`ContApp_Setup-${{ steps.version.outputs.VERSION }}.exe`** (recomendado): instalador que crea acceso directo en el Menu Inicio y desinstalador en "Agregar o quitar programas".
            - **`ContApp-${{ steps.version.outputs.VERSION }}-portable.zip`** (alternativa): descomprimir y ejecutar `ContApp.exe`. No instala nada.

            ### Notas de la version

            Ver el cuerpo del release o la [lista de releases](https://github.com/LuchitoCode08/Demo/releases).
          draft: true
          generate_release_notes: true
          files: |
            dist/ContApp_Setup-*.exe
            dist/ContApp-*-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}