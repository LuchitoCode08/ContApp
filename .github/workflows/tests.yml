# Workflow: correr tests en cada push/PR

# Stack: Python only (no Node).
# La alerta de Node20 obsoleto en GitHub Actions no aplica a este repo.
# Rapido (sin build, sin Inno Setup), solo valida la suite de pytest.

# Versions pinned (no tags moviles) para maxima reproducibilidad.
# Para actualizar: editar este header y commitear.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Python 3.14
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Correr tests
        run: python -m pytest tests/ -v --tb=short