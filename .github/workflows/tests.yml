# Workflow: tests
#
# Corre la suite de pytest en cada push o PR a main.
# Si falla, el check rojo bloquea el merge (en PRs) o
# avisa al autor (en push directo).
#
# Stack: Python only.
# La alerta de Node20 obsoleto en GitHub Actions no aplica a este repo.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Setup Python 3.14
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Correr tests
        run: python -m pytest tests/ -v --tb=short
