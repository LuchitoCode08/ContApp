# Dependabot configuration.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Vigila las versiones de las GitHub Actions usadas en .github/workflows/
# y abre PRs automaticos cuando hay updates. Como tenemos versiones PINNED,
# Dependabot va a sugerir el bump exacto (ej: v5.0.0 -> v5.0.1).
#
# No vigilamos pip porque el requirements.txt ya esta pinneado a versiones
# exactas en cada release (ver proceso de release.yml).

version: 2
updates:
  # Vigilar versiones de GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    # Solo abrir 1 PR a la vez (para no abrumar).
    open-pull-requests-limit: 3
    # Agrupar updates de la misma action en un solo PR.
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Etiquetas y reviewers.
    labels:
      - "dependencies"
      - "github-actions"
    # Commit message claro.
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    # No abrir PRs para major bumps automaticamente (requieren review manual).
    # Asi evitamos el caso checkout@v4 -> v5 con breaking changes sin querer.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]